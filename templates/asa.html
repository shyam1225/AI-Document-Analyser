<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI PDF Analyzer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
#load{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,0.9);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.spinner{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,0.2);
    border-top:6px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

#load p{
    color:white;
    margin-top:15px;
    font-size:18px;
}

@keyframes spin{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
}
body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    font-family:Verdana,Geneva,Tahoma,sans-serif;
}
.sample-questions{
    display:none;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin:auto;
    max-width:700px;
    margin-top:5px;
}

.sample-questions button{
    background:#55678e63;
    color:white;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:10px 16px;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.sample-questions button:hover{
    background:#3a4656;
    transform:translateY(-2px);
}
.container{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1e293b;
    overflow:hidden;
    position:relative;
}
#uploadBtn{
    width:100px;
    padding:5px;
    cursor:pointer;
    border-radius:8px;
    align-items:center
}

#fileInfo{
    color:#9ca3af;
    font-size:14px;
}
.header{
    padding:24px;
    text-align:center;
    background:#0f172a;
    color:white;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-family:Baskerville,serif;
}

.header h1{
    font-size:2rem;
    font-weight:600;
}

.upload-section{
    padding:20px;
    background:#1e293b;
    color:#cbd5e1;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    max-height:200px;
    overflow:hidden;
    transition:all 0.3s ease;
}
.upload-section.hidden{
    max-height:0;
    padding-top:0;
    padding-bottom:0;
    border-bottom:none;
    opacity:0;
}
.supported{
    margin-top:10px;
    font-size:14px;
    opacity:0.8;
    align-items:center
}

#pdfFile{
    color:white;
    margin-bottom:10px;
    align-items:center
}

.chat-container{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:20px;
    background:#334155;
}

.disclaimer{
    align-self:flex-start;
    background:#11182763;
    color:#ffffff;
    padding:12px 18px;
    border-radius:18px;
    max-width:80%;
    line-height:1.5;
}

.message{
    align-self:flex-end;
    background:#e5e7eb;
    color:#111827;
    padding:12px 18px;
    border-radius:20px;
    max-width:75%;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.bot-message{
    align-self:flex-start;
    background:#11182763;
    color:rgb(255, 255, 255);
    padding:14px 18px;
    border-radius:20px;
    max-width:75%;
    line-height:1.6;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.input-section{
    display:flex;
    align-items:center;
    padding:15px;
    background:#1e293b;
    border-top:1px solid rgba(255,255,255,0.08);
}

#questionInput{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#475569;
    color:white;
    font-size:15px;
    outline:none;
}

#questionInput::placeholder{
    color:#cbd5e1;
}

.send-btn{
    margin-left:10px;
    padding:14px 25px;
    border:none;
    border-radius:12px;
    background:#6122c5;
    color:white;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.send-btn:hover{
    background:#3e16a3;
}

#preview{
    margin-top:10px;
    align-items:center
}

#preview a{
    color:#60a5fa;
    text-decoration:none;
    display:block;
    margin-bottom:5px;
    align-items:center
}

#preview a:hover{
    text-decoration:underline;
}

.chat-container::-webkit-scrollbar{
    width:8px;
}

.chat-container::-webkit-scrollbar-track{
    background:#334155;
}

.chat-container::-webkit-scrollbar-thumb{
    background:#64748b;
    border-radius:10px;
}

.chat-container::-webkit-scrollbar-thumb:hover{
    background:#94a3b8;
}
</style>
</head>
<div id="load">
        <div class="spinner"></div>
             <p>Processing...</p>
        </div>
<body>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="container">

    <div class="header">
        <h1>AI DOCUMENT ANALYZER</h1>
    </div>

    <div class="upload-section">
    <input type="file" id="pdfFile" accept=".pdf,.txt,.docx,.png,.jpg,.jpeg" multiple hidden> 
    <button type="button" id="uploadBtn">
        Choose Files
    </button>
    <span id="fileInfo">
        supported formats: pdf, txt, docx, png, jpg, jpeg
    </span>
    

    <div class="preview" id="preview"></div>

</div>

    <div class="chat-container" id="chatContainer">

        
        <div class="sample-questions" id="sampleQuestions">
    <button onclick="useQuestion('Summarize the document')">
        Summarize
    </button>

    <button onclick="useQuestion('What are the key insights?')">
        Key Insights
    </button>

    <button onclick="useQuestion('List important data and numbers')">
        Important Data
    </button>

</div>

    </div>
    
    <div class="input-section">
        
        <input
            type="text"
            id="questionInput"
            placeholder="Ask a question..."
        >
        
        <button id="sendBtn" class="send-btn" onclick="sendQuestion()">
            Send
        </button>

    </div>

</div>
<script>
let isProcessing= false;
const questionInput = document.getElementById("questionInput");

questionInput.addEventListener("input", () => {

    if(questionInput.value.trim() !== ""){
        document.getElementById("sampleQuestions")
                .style.display = "none";
    }

});
const uploadSection =document.querySelector(".upload-section");
const chatContainer =document.getElementById("chatContainer");
chatContainer.addEventListener("scroll", () => {

    if(chatContainer.scrollTop > 50){
        uploadSection.classList.add("hidden");
    }
    else{
        uploadSection.classList.remove("hidden");
    }

});
const uploadBtn = document.getElementById("uploadBtn");
const pdfFile = document.getElementById("pdfFile");
const fileInfo = document.getElementById("fileInfo");
uploadBtn.addEventListener("click", () => {
    pdfFile.click();
});
pdfFile.addEventListener("change", () => {
    if (pdfFile.files.length > 0) {
        fileInfo.textContent = `${pdfFile.files.length} file(s) selected`;
    } else {
        fileInfo.textContent =
            "supported formats: pdf, txt, docx, png, jpg, jpeg";
    }
});
let uploadComplete = false;
const sendBtn = document.getElementById("sendBtn");
const files = document.getElementById("pdfFile");
files.multiple = true;
const preview = document.getElementById("preview");
preview.innerHTML = "";
async function useQuestion(question){

    document.getElementById("sampleQuestions")
            .style.display = "none";

    document.getElementById("questionInput").value =
            question;

    await sendQuestion();
}
files.addEventListener("change", async function(event) {
    
    const loader = document.getElementById("load");
    loader.style.display = "flex"; // SHOW LOADER

    try {
        const uploadData = new FormData();
        preview.innerHTML = "";
        sendBtn.disabled = true;
        sendBtn.textContent = "Processing...";
        uploadComplete = false;

        for (const file of event.target.files) {
            const fileURL = URL.createObjectURL(file);
            preview.innerHTML += `
                <a href="${fileURL}" target="_blank">
                    ${file.name}
                </a><br>
            `;

            uploadData.append("files", file);
        }

        const response = await fetch("/upload", {
            method: "POST",
            body: uploadData
        });

        const data = await response.json();
        console.log(data);
        uploadComplete = true;
        document.getElementById("sampleQuestions")
        .style.display = "flex";
    }
    catch(error) {
        console.error(error);
    }
    finally {
        loader.style.display = "none"; // HIDE LOADER
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
    }
});


function addBotMessage(message){

    const chatContainer =
        document.getElementById("chatContainer");

    chatContainer.innerHTML += `
        <div class="bot-message">
            ${message}
        </div>
    `;

    chatContainer.scrollTop =
        chatContainer.scrollHeight;
}

async function sendQuestion() {

    if (isProcessing) return;

    isProcessing = true;

    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.querySelector(".send-btn");
    const chatContainer = document.getElementById("chatContainer");

    sendBtn.disabled = true;
    questionInput.disabled = true;

    try {

        const question = questionInput.value.trim();

        if (!uploadComplete) {
            thinkingDiv.innerHTML = "Please wait until document processing is complete.";
            return;
        }

        if (question === "") {
            return;
        }

        // User message
        chatContainer.innerHTML += `
            <div class="message">
                ${question}
            </div>
        `;

        // Thinking message
        const thinkingDiv = document.createElement("div");
        thinkingDiv.className = "bot-message";
        thinkingDiv.innerHTML = "Thinking...";

        chatContainer.appendChild(thinkingDiv);

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

        const formData = new FormData();
        formData.append("question", question);

        questionInput.value = "";

        console.log("Sending request...");

        const response = await fetch("/ask", {
            method: "POST",
            body: formData
        });

        console.log("Response received");

        const data = await response.json();

        try {

            const jsonMatch =
                data.answer.match(/\{[\s\S]*\}/);

            if (!jsonMatch) {
                throw new Error("No JSON found");
            }

            const chartData =
                JSON.parse(jsonMatch[0]);

            console.log(chartData);

            if (chartData.type === "chart") {

                thinkingDiv.innerHTML = "";

                const chartWrapper =
                    document.createElement("div");

                chartWrapper.style.width = "600px";
                chartWrapper.style.maxWidth = "100%";
                chartWrapper.style.height = "350px";
                chartWrapper.style.background = "#ffffff";
                chartWrapper.style.borderRadius = "12px";
                chartWrapper.style.padding = "15px";

                const canvas =
                    document.createElement("canvas");

                chartWrapper.appendChild(canvas);
                thinkingDiv.appendChild(chartWrapper);

                let datasetConfig = {};

                switch (chartData.chart_type) {

                    case "line":
                        datasetConfig = {
                            label: chartData.title,
                            data: chartData.values,
                            borderColor: "#3b82f6",
                            backgroundColor:
                                "rgba(59,130,246,0.2)",
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5
                        };
                        break;

                    case "bar":
                        datasetConfig = {
                            label: chartData.title,
                            data: chartData.values,
                            backgroundColor: [
                                "#3b82f6",
                                "#8b5cf6",
                                "#10b981",
                                "#f59e0b",
                                "#ef4444",
                                "#06b6d4"
                            ]
                        };
                        break;

                    case "pie":
                    case "doughnut":
                        datasetConfig = {
                            label: chartData.title,
                            data: chartData.values,
                            backgroundColor: [
                                "#3b82f6",
                                "#8b5cf6",
                                "#10b981",
                                "#f59e0b",
                                "#ef4444",
                                "#06b6d4",
                                "#ec4899",
                                "#14b8a6"
                            ]
                        };
                        break;

                    default:
                        datasetConfig = {
                            label: chartData.title,
                            data: chartData.values,
                            borderColor: "#3b82f6"
                        };
                }

                new Chart(canvas, {
                    type: chartData.chart_type,
                    data: {
                        labels: chartData.labels,
                        datasets: [datasetConfig]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            title: {
                                display: true,
                                text: chartData.title,
                                color: "#111827",
                                font: {
                                    size: 18
                                }
                            },

                            legend: {
                                labels: {
                                    color: "#111827"
                                }
                            }
                        },

                        scales:
                            chartData.chart_type === "pie" ||
                            chartData.chart_type === "doughnut"
                                ? {}
                                : {
                                      x: {
                                          ticks: {
                                              color: "#111827"
                                          }
                                      },
                                      y: {
                                          ticks: {
                                              color: "#111827"
                                          }
                                      }
                                  }
                    }
                });

            } else {

                thinkingDiv.innerHTML =
                    marked.parse(data.answer);
            }

        } catch (error) {

            console.log("Not chart JSON:", error);

            thinkingDiv.innerHTML =
                marked.parse(data.answer);
        }

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    } catch (error) {

        console.error("Error:", error);

        const errorDiv =
            document.createElement("div");

        errorDiv.className = "bot-message";
        errorDiv.innerHTML =
            "An error occurred while processing your request.";

        chatContainer.appendChild(errorDiv);

    } finally {

        sendBtn.disabled = false;
        questionInput.disabled = false;
        isProcessing = false;
    }
}

</script>
</body>
</html>
